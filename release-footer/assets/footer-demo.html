<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Release Footer · 样式演示</title>
  <!-- Standalone demo. Embedded footer markup/styles are sourced from footer.html; refresh together. -->
  <style>

  .release-footer { border-top: 1px solid rgb(0 0 0 / 6%); background: #eef1f3; color: #68757f; }
  .release-footer__inner { box-sizing: border-box; max-width: 1560px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 6px; text-align: center; font: 400 .75rem/1.5 var(--release-footer-font-family, "Twemoji Country Flags", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Source Han Sans, sans-serif, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol, Noto Color Emoji, BlinkMacSystemFont, Helvetica Neue, Arial, PingFang SC, PingFang TC, PingFang HK, Microsoft Yahei UI, Microsoft Yahei, Microsoft JhengHei); }
  .release-footer__part, .release-footer__revision { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .release-footer__icon { display: block; width: 18px; height: 18px; flex: none; overflow: visible; }
  .release-footer__sha { font-family: var(--release-footer-font-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace); font-variant-numeric: tabular-nums; }
  .release-footer__status { display: inline-flex; align-items: center; margin-left: 2px; font-size: .75em; line-height: 1; vertical-align: baseline; transform: translateY(-.45em); }
  .release-footer__badge { display: inline-block; border-radius: 50rem; padding: .35em .65em; background: var(--release-stage-color, #6c757d); color: white; font-weight: 700; font-style: italic; line-height: 1; }
  .release-footer__badge[data-stage="alpha"], .release-footer__badge[data-stage="stable"] { --release-stage-color: #198754; }
  .release-footer__badge[data-stage="beta"] { --release-stage-color: #0d6efd; }
  .release-footer__badge[data-stage="rc"], .release-footer__badge[data-stage="deprecated"] { --release-stage-color: #b45309; }
  .release-footer__badge[data-stage="lts"] { --release-stage-color: #0f766e; }
  @media (min-width: 640px) {
    .release-footer__inner { padding-inline: 28px; font-size: .875rem; }
  }

    :root { --release-footer-font-family: "Twemoji Country Flags", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Source Han Sans, sans-serif, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol, Noto Color Emoji, BlinkMacSystemFont, Helvetica Neue, Arial, PingFang SC, PingFang TC, PingFang HK, Microsoft Yahei UI, Microsoft Yahei, Microsoft JhengHei; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f8fa; color: #24313c; font-family: var(--release-footer-font-family); }
    .demo { max-width: 1184px; margin: auto; padding: 40px 28px; }
    .eyebrow { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .13em; color: #198754; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 36px); font-weight: 650; letter-spacing: -.04em; }
    .intro { margin: 12px 0 28px; font-size: 14px; line-height: 1.7; color: #72808b; }
    .settings { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; background: #fff; padding: 22px; border: 1px solid #e0e5e9; border-radius: 12px; }
    .field { display: grid; gap: 8px; font-size: 12px; color: #64727d; }
    select, input[type="text"] { min-height: 40px; width: 210px; border: 1px solid #d7dfe5; border-radius: 7px; padding: 8px 10px; background: #fff; color: #24313c; font: 14px var(--release-footer-font-family); }
    .toggle { display: flex; align-items: center; gap: 8px; min-height: 40px; color: #53636f; font-size: 14px; }
    input[type="checkbox"] { accent-color: #198754; }
    .preview-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 0 14px; }
    .preview-heading strong { font-size: 14px; font-weight: 600; }
    .sizes { display: flex; flex-wrap: wrap; gap: 6px; }
    button { cursor: pointer; font: 12px var(--release-footer-font-family); border: 1px solid #dbe2e7; background: #fff; color: #657580; border-radius: 6px; padding: 8px 12px; }
    button[aria-pressed="true"] { border-color: #198754; color: #146c43; background: #eaf5ef; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #198754; outline-offset: 3px; }
    .stage-button:hover, .sizes button:hover { border-color: #91bca4; }
    .canvas { display: flex; justify-content: center; padding: 20px; border: 1px solid #e0e5e9; border-radius: 12px; background: #e9edf1; }
    iframe { display: block; width: 100%; max-width: 100%; height: 250px; border: 1px solid #d6dfe5; border-radius: 9px; background: #fff; }
    .caption { margin: 12px 0 26px; color: #788691; font-size: 12px; line-height: 1.7; }
    h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; }
    .stages { display: flex; flex-wrap: wrap; gap: 8px; }
    .stage-button { min-height: 42px; display: flex; align-items: center; gap: 8px; }
    .stage-button .release-footer__badge { font-size: 12px; }
    .description { margin: 14px 0 0; min-height: 24px; font-size: 13px; color: #72808b; line-height: 1.7; }
    .notice { margin-top: 28px; font-size: 12px; color: #8c98a1; }
    @media(max-width: 600px) { .demo { padding: 24px 16px; } .settings { padding: 16px; gap: 14px; } .field { flex: 1 1 160px; } select,input[type="text"] { width: 100%; } .canvas { padding: 10px; } }
  </style>
</head>
<body>
  <main class="demo">
    <p class="eyebrow">RELEASE FOOTER / DEMO</p>
    <h1>页脚样式演示</h1>
    <p class="intro">整体水平居中，正文、分支图标与提交号垂直居中，状态徽标独立上移。名称可修改，也可切换阶段和屏幕宽度查看效果。</p>
    <form class="settings" onsubmit="return false">
      <label class="field">站点 / 品牌 / 系列名称<input id="brand" type="text" value="HICAT" maxlength="64" placeholder="留空默认 HICAT"></label>
      <label class="field">发布阶段<select id="stage"><option value="dev">Dev · 开发中</option><option value="pre-alpha">Pre-alpha · 早期原型</option><option value="alpha" selected>αlpha · 内测版</option><option value="beta">Beta · 公测版</option><option value="rc">RC · 发布候选版</option><option value="stable">Stable · 稳定版</option><option value="lts">LTS · 长期支持</option><option value="deprecated">Deprecated · 已弃用</option><option value="eol">EOL · 停止维护</option><option value="custom">Custom · 自定义</option></select></label>
      <label class="field">徽标文字<input id="label" type="text" maxlength="32" placeholder="留空使用阶段默认文字"></label>
      <label class="toggle"><input id="visible" type="checkbox" checked>显示徽标</label>
    </form>
    <div class="preview-heading"><strong id="viewport-label">桌面预览</strong><div class="sizes" aria-label="预览宽度"><button type="button" data-width="desktop" aria-pressed="true">桌面</button><button type="button" data-width="375" aria-pressed="false">手机 375px</button><button type="button" data-width="280" aria-pressed="false">窄屏 280px</button></div></div>
    <div class="canvas"><iframe id="preview" title="页脚实时预览" sandbox="allow-same-origin"></iframe></div>
    <p class="caption">窄屏允许成组换行，每行保持居中；隐藏徽标时移除整个上标节点。</p>
    <h2>阶段与维护状态 · 点击切换</h2>
    <div class="stages" id="stages"></div>
    <p class="description" id="description" aria-live="polite"></p>
    <p class="notice">名称可自定义，未填写时默认显示 HICAT。年份、版本与提交号均为演示数据；本文件可离线打开。</p>
  </main>
  <script>
    const footerTemplate = "<!-- Visual template only. HICAT is the default site/brand/series name.\n     Bind release-footer__brand to the configured name; missing or blank names fall back to HICAT.\n     Replace example values with real release metadata.\n     Configure the badge's data-stage and text together; see references/release-stages.md.\n     Remove the entire status sup when the badge is hidden. -->\n<style>\n  .release-footer { border-top: 1px solid rgb(0 0 0 / 6%); background: #eef1f3; color: #68757f; }\n  .release-footer__inner { box-sizing: border-box; max-width: 1560px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 6px; text-align: center; font: 400 .75rem/1.5 var(--release-footer-font-family, \"Twemoji Country Flags\", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Source Han Sans, sans-serif, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol, Noto Color Emoji, BlinkMacSystemFont, Helvetica Neue, Arial, PingFang SC, PingFang TC, PingFang HK, Microsoft Yahei UI, Microsoft Yahei, Microsoft JhengHei); }\n  .release-footer__part, .release-footer__revision { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }\n  .release-footer__icon { display: block; width: 18px; height: 18px; flex: none; overflow: visible; }\n  .release-footer__sha { font-family: var(--release-footer-font-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace); font-variant-numeric: tabular-nums; }\n  .release-footer__status { display: inline-flex; align-items: center; margin-left: 2px; font-size: .75em; line-height: 1; vertical-align: baseline; transform: translateY(-.45em); }\n  .release-footer__badge { display: inline-block; border-radius: 50rem; padding: .35em .65em; background: var(--release-stage-color, #6c757d); color: white; font-weight: 700; font-style: italic; line-height: 1; }\n  .release-footer__badge[data-stage=\"alpha\"], .release-footer__badge[data-stage=\"stable\"] { --release-stage-color: #198754; }\n  .release-footer__badge[data-stage=\"beta\"] { --release-stage-color: #0d6efd; }\n  .release-footer__badge[data-stage=\"rc\"], .release-footer__badge[data-stage=\"deprecated\"] { --release-stage-color: #b45309; }\n  .release-footer__badge[data-stage=\"lts\"] { --release-stage-color: #0f766e; }\n  @media (min-width: 640px) {\n    .release-footer__inner { padding-inline: 28px; font-size: .875rem; }\n  }\n<\/style>\n<footer class=\"release-footer\">\n  <p class=\"release-footer__inner\">\n    <span class=\"release-footer__part\">© <span class=\"release-footer__brand\">HICAT<\/span> 2026 <span aria-hidden=\"true\">/<\/span><\/span>\n    <span class=\"release-footer__part\">Currently v0.7 <span aria-hidden=\"true\">/<\/span><\/span>\n    <span class=\"release-footer__revision\">\n      <svg class=\"release-footer__icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" aria-hidden=\"true\">\n        <path d=\"M17 7a2 2 0 1 0 0-4a2 2 0 0 0 0 4M7 7a2 2 0 1 0 0-4a2 2 0 0 0 0 4m0 14a2 2 0 1 0 0-4a2 2 0 0 0 0 4M7 7v10M17 7v1c0 2.5-2 3-2 3l-6 2s-2 .5-2 3v1\" />\n      <\/svg>\n      <span class=\"release-footer__sha\">cff8cae<\/span>\n      <sup class=\"release-footer__status\"><span class=\"release-footer__badge\" data-stage=\"alpha\" aria-label=\"alpha 版本\">αlpha<\/span><\/sup>\n    <\/span>\n  <\/p>\n<\/footer>\n";
    const stages = {
      dev: ['Dev', '开发中：功能正在实现，尚未正式发布。'],
      'pre-alpha': ['Pre-alpha', '早期原型：核心功能尚不完整。'],
      alpha: ['αlpha', '内测版：初步可用，仍可能有较多变化。'],
      beta: ['Beta', '公测版：功能基本完整，重点测试与修复。'],
      rc: ['RC.1', '发布候选版：接近正式发布，进行最终验证。'],
      stable: ['Stable', '正式稳定版：已完成发布验证，也可选择隐藏徽标。'],
      lts: ['LTS', '维护状态：长期支持版本。'],
      deprecated: ['Deprecated', '维护状态：已弃用，建议迁移。'],
      eol: ['EOL', '维护状态：已停止维护。'],
      custom: ['Internal', '自定义内容：填写徽标文字，默认使用中性灰色。']
    };
    const brandInput = document.querySelector('#brand');
    const stageSelect = document.querySelector('#stage');
    const labelInput = document.querySelector('#label');
    const visibleInput = document.querySelector('#visible');
    const frame = document.querySelector('#preview');
    const chipContainer = document.querySelector('#stages');
    for (const [key, [label]] of Object.entries(stages)) {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'stage-button'; button.dataset.stage = key;
      button.setAttribute('aria-pressed', String(key === 'alpha'));
      const badge = document.createElement('span');
      badge.className = 'release-footer__badge'; badge.dataset.stage = key; badge.textContent = label;
      button.append(badge);
      button.addEventListener('click', () => { stageSelect.value = key; labelInput.value = ''; render(); });
      chipContainer.append(button);
    }
    function render() {
      const brand = brandInput.value.trim() || 'HICAT';
      const stage = stageSelect.value;
      const label = labelInput.value.trim() || stages[stage][0];
      const doc = new DOMParser().parseFromString(footerTemplate, 'text/html');
      doc.querySelector('.release-footer__brand').textContent = brand;
      const brandHeading = doc.createElement('strong');
      brandHeading.textContent = brand;
      frame.title = brand + ' 页脚实时预览';
      const badge = doc.querySelector('.release-footer__badge');
      badge.dataset.stage = stage; badge.textContent = label; badge.setAttribute('aria-label', label + ' 版本状态');
      if (!visibleInput.checked) doc.querySelector('.release-footer__status').remove();
      const content = doc.head.innerHTML + doc.body.innerHTML;
      frame.srcdoc = '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:white}main{flex:1;display:grid;place-content:center;text-align:center;color:#a5afb7;font:14px system-ui}main strong{font-size:20px;font-weight:500;margin-bottom:8px}main span{font-size:12px;color:#bac2c8}</style></head><body><main>' + brandHeading.outerHTML + '<span>页面内容</span></main>' + content + '</body></html>';
      document.querySelector('#description').textContent = stages[stage][1];
      document.querySelectorAll('.stage-button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.stage === stage)));
    }
    brandInput.addEventListener('input', render);
    stageSelect.addEventListener('change', () => { labelInput.value = ''; render(); });
    labelInput.addEventListener('input', render);
    visibleInput.addEventListener('change', render);
    document.querySelectorAll('[data-width]').forEach(button => button.addEventListener('click', () => {
      const width = button.dataset.width;
      frame.style.width = width === 'desktop' ? '100%' : width + 'px';
      document.querySelector('#viewport-label').textContent = width === 'desktop' ? '桌面预览' : width === '375' ? '手机预览 · 375px' : '窄屏预览 · 280px';
      document.querySelectorAll('[data-width]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    }));
    render();
  </script>
</body>
</html>
